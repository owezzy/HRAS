name: Deploy HRAS to Production

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Deployment type'
        required: true
        default: 'rolling'
        type: choice
        options:
          - rolling
          - blue-green
      skip_backup:
        description: 'Skip backup before deployment'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v1

    - name: Install dependencies
      run: |
        cd backend
        uv sync --all-groups

    - name: Run linting
      run: |
        cd backend
        uv run ruff check src agents chains tools vectorstore prompts

    - name: Run tests
      run: |
        cd backend
        uv run pytest tests/ -v --cov=src --cov-report=xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}-backend
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/hras-deploy-key.pem
        chmod 600 ~/.ssh/hras-deploy-key.pem
        ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Create deployment configuration
      run: |
        mkdir -p deploy/config
        cat > deploy/config/deployment.env << EOF
        AWS_REGION=${{ env.AWS_REGION }}
        EC2_INSTANCE_ID=${{ env.EC2_INSTANCE_ID }}
        EC2_HOST=${{ env.EC2_HOST }}
        EC2_USER=${{ env.EC2_USER }}
        EC2_SSH_KEY_PATH=~/.ssh/hras-deploy-key.pem

        DOMAIN=${{ secrets.DOMAIN }}
        EMAIL=${{ secrets.EMAIL }}
        SSL_PROVIDER=${{ secrets.SSL_PROVIDER }}
        SSL_CHALLENGE=${{ secrets.SSL_CHALLENGE }}
        ROUTE53_HOSTED_ZONE_ID=${{ secrets.ROUTE53_HOSTED_ZONE_ID }}

        APP_NAME=hras
        APP_VERSION=sha-${{ github.sha }}
        DOCKER_REGISTRY=ghcr.io/${{ github.repository_owner }}
        BACKEND_PORT=8000

        DATABASE_URL=${{ secrets.DATABASE_URL }}
        POSTGRES_DB=${{ secrets.POSTGRES_DB }}
        POSTGRES_USER=${{ secrets.POSTGRES_USER }}
        POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

        SECRET_KEY=${{ secrets.SECRET_KEY }}
        CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}

        DEPLOYMENT_STRATEGY=${{ github.event.inputs.deployment_type || 'rolling' }}
        BACKUP_BEFORE_DEPLOY=${{ github.event.inputs.skip_backup != 'true' }}
        ROLLBACK_ON_FAILURE=true

        ENABLE_MONITORING=true
        GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        ALERTMANAGER_WEBHOOK_URL=${{ secrets.ALERTMANAGER_WEBHOOK_URL }}

        S3_BACKUP_BUCKET=${{ secrets.S3_BACKUP_BUCKET }}
        S3_BACKUP_PREFIX=production
        BACKUP_RETENTION_DAYS=30

        USE_POSTGRES=true
        USE_ASYNC_TOOLS=true

        OLLAMA_BASE_URL=${{ secrets.OLLAMA_BASE_URL }}
        OLLAMA_MODEL=${{ secrets.OLLAMA_MODEL }}
        OLLAMA_EMBEDDING_MODEL=${{ secrets.OLLAMA_EMBEDDING_MODEL }}
        EOF

    - name: Sync deployment files to server
      run: |
        rsync -avz -e "ssh -i ~/.ssh/hras-deploy-key.pem -o StrictHostKeyChecking=no" \
          deploy/ ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:/tmp/hras-deploy/

        ssh -i ~/.ssh/hras-deploy-key.pem -o StrictHostKeyChecking=no \
          ${{ env.EC2_USER }}@${{ env.EC2_HOST }} \
          "sudo mkdir -p /opt/hras/deploy && sudo cp -r /tmp/hras-deploy/* /opt/hras/deploy/ && sudo chmod +x /opt/hras/deploy/scripts/*.sh"

    - name: Run pre-deployment health check
      run: |
        ssh -i ~/.ssh/hras-deploy-key.pem -o StrictHostKeyChecking=no \
          ${{ env.EC2_USER }}@${{ env.EC2_HOST }} \
          "cd /opt/hras/deploy && ./scripts/health-check.sh || echo 'Pre-deployment health check completed'"

    - name: Deploy application
      id: deploy
      run: |
        ssh -i ~/.ssh/hras-deploy-key.pem -o StrictHostKeyChecking=no \
          ${{ env.EC2_USER }}@${{ env.EC2_HOST }} \
          "cd /opt/hras/deploy && sudo -E ./scripts/deploy.sh"

    - name: Run post-deployment health check
      run: |
        ssh -i ~/.ssh/hras-deploy-key.pem -o StrictHostKeyChecking=no \
          ${{ env.EC2_USER }}@${{ env.EC2_HOST }} \
          "cd /opt/hras/deploy && ./scripts/health-check.sh"

    - name: Send deployment notification
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
        custom_payload: |
          {
            text: `HRAS Deployment ${process.env.AS_JOB_STATUS}`,
            attachments: [{
              color: '${{ job.status }}' === 'success' ? 'good' : 'danger',
              fields: [{
                title: 'Repository',
                value: '${{ github.repository }}',
                short: true
              }, {
                title: 'Branch',
                value: '${{ github.ref_name }}',
                short: true
              }, {
                title: 'Commit',
                value: '${{ github.sha }}',
                short: true
              }, {
                title: 'Deployment Type',
                value: '${{ github.event.inputs.deployment_type || 'rolling' }}',
                short: true
              }, {
                title: 'Status',
                value: '${{ job.status }}',
                short: true
              }]
            }]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  rollback:
    name: Emergency Rollback
    runs-on: ubuntu-latest
    if: failure() && needs.deploy.result == 'failure'
    needs: deploy
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/hras-deploy-key.pem
        chmod 600 ~/.ssh/hras-deploy-key.pem
        ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Perform emergency rollback
      run: |
        ssh -i ~/.ssh/hras-deploy-key.pem -o StrictHostKeyChecking=no \
          ${{ env.EC2_USER }}@${{ env.EC2_HOST }} \
          "cd /opt/hras/deploy && sudo ./scripts/rollback.sh"

    - name: Verify rollback
      run: |
        ssh -i ~/.ssh/hras-deploy-key.pem -o StrictHostKeyChecking=no \
          ${{ env.EC2_USER }}@${{ env.EC2_HOST }} \
          "cd /opt/hras/deploy && ./scripts/health-check.sh"

    - name: Send rollback notification
      uses: 8398a7/action-slack@v3
      with:
        status: custom
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        custom_payload: |
          {
            text: "🚨 HRAS Emergency Rollback Completed",
            attachments: [{
              color: 'warning',
              fields: [{
                title: 'Repository',
                value: '${{ github.repository }}',
                short: true
              }, {
                title: 'Failed Commit',
                value: '${{ github.sha }}',
                short: true
              }, {
                title: 'Action',
                value: 'Emergency rollback performed due to deployment failure',
                short: false
              }]
            }]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
