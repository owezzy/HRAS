name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22.x'
  PYTHON_VERSION: '3.12'

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://${{ secrets.HETZNER_DOMAIN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync --all-groups

      - name: Lint backend
        run: |
          cd backend
          uv run ruff check src

      - name: Run backend tests
        run: |
          cd backend
          uv run pytest tests/ -v --cov=src --cov-report=xml

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: quality-gates
    if: success() || github.event.inputs.force_deploy == 'true'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} "
            sudo mkdir -p /opt/hras
            sudo chown ${{ secrets.HETZNER_USER }}:${{ secrets.HETZNER_USER }} /opt/hras
          "

      - name: Sync repository to Hetzner
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='coverage.xml' \
            --delete \
            ./ ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/opt/hras/

      - name: Create Hetzner environment file
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} "cat > /opt/hras/.env.hetzner <<'EOF'
          DOMAIN=${{ secrets.HETZNER_DOMAIN }}
          LETSENCRYPT_EMAIL=${{ secrets.HETZNER_LETSENCRYPT_EMAIL }}
          FRONTEND_DOMAIN=${{ secrets.HETZNER_FRONTEND_DOMAIN }}
          APP_NAME=hras
          APP_VERSION=${{ github.sha }}
          APP_ENV=production
          DEBUG=false
          DOCS_ENABLED=true
          BACKEND_PORT=8000
          POSTGRES_PORT=5432
          PROMETHEUS_PORT=9090
          GRAFANA_PORT=3001
          LOKI_PORT=3100
          DATABASE_URL=postgresql+asyncpg://hras:${{ secrets.HETZNER_DB_PASSWORD }}@postgres:5432/hras
          POSTGRES_DB=hras
          POSTGRES_USER=hras
          POSTGRES_PASSWORD=${{ secrets.HETZNER_DB_PASSWORD }}
          SECRET_KEY=${{ secrets.HETZNER_SECRET_KEY }}
          JWT_SECRET_KEY=${{ secrets.HETZNER_JWT_SECRET_KEY }}
          HEALTH_CHECK_TOKEN=${{ secrets.HETZNER_HEALTH_CHECK_TOKEN }}
          ALLOWED_SSH_CIDR=${{ secrets.HETZNER_ALLOWED_SSH_CIDR }}
          SWAP_SIZE_GB=8
          CORS_ORIGINS=["${{ secrets.HETZNER_FRONTEND_DOMAIN }}","https://hras.owezzy.tech","https://hetzner-api.hras.owezzy.tech"]
          TRUSTED_HOSTS=["localhost","127.0.0.1","backend","backend:8000","${{ secrets.HETZNER_DOMAIN }}"]
          USE_POSTGRES=true
          USE_ASYNC_TOOLS=true
          USE_LANGSMITH_TRACING=${{ secrets.USE_LANGSMITH_TRACING || 'true' }}
          ENABLE_PRODUCTION_EVALUATIONS=${{ secrets.ENABLE_PRODUCTION_EVALUATIONS || 'false' }}
          BACKUP_BEFORE_DEPLOY=true
          BACKUP_RETENTION_DAYS=30
          ROLLBACK_ON_FAILURE=true
          HEALTH_CHECK_TIMEOUT=300
          OLLAMA_BASE_URL=http://ollama:11434
          OLLAMA_MODEL=nemotron-3-nano:30b-cloud
          OLLAMA_EMBEDDING_MODEL=nomic-embed-text
          OLLAMA_TIMEOUT=180
          CHROMA_PERSIST_DIRECTORY=/app/chroma_db
          LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT=${{ secrets.LANGSMITH_PROJECT || 'hras-production' }}
          LANGSMITH_ENDPOINT=https://api.smith.langchain.com
          GRAFANA_ADMIN_PASSWORD=${{ secrets.HETZNER_GRAFANA_ADMIN_PASSWORD }}
          NOTIFICATION_WEBHOOK=${{ secrets.SLACK_WEBHOOK_URL }}
          EOF"

      - name: Install and reload systemd service
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} "
            cd /opt/hras
            chmod +x zarf/scripts/*.sh
            sudo cp zarf/docker/hras-hetzner.service /etc/systemd/system/hras-hetzner.service
            sudo systemctl daemon-reload
            sudo systemctl enable hras-hetzner.service
          "

      - name: Deploy application
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} "
            cd /opt/hras
            ./zarf/scripts/deploy-hetzner.sh deploy
          "

      - name: Verify deployment health
        run: |
          for i in {1..12}; do
            if curl -f -s https://${{ secrets.HETZNER_DOMAIN }}/health >/dev/null; then
              echo '✅ Backend health check passed'
              exit 0
            fi

            echo "⏳ Waiting for backend... (attempt $i/12)"
            sleep 10
          done

          echo '❌ Backend health check failed after 12 attempts'
          exit 1

      - name: Run post-deployment tests
        run: |
          CHAT_RESPONSE=$(curl -s -X POST https://${{ secrets.HETZNER_DOMAIN }}/api/v1/chat \
            -H 'Content-Type: application/json' \
            -d '{"message": "Hello, test deployment"}')

          if echo "$CHAT_RESPONSE" | jq -e '.message.content' >/dev/null; then
            echo '✅ Chat endpoint test passed'
          else
            echo '❌ Chat endpoint test failed'
            echo "$CHAT_RESPONSE"
            exit 1
          fi

          STATS_RESPONSE=$(curl -s https://${{ secrets.HETZNER_DOMAIN }}/api/v1/admin/stats)
          if echo "$STATS_RESPONSE" | jq -e '.document_count // .count' >/dev/null; then
            echo '✅ Admin stats test passed'
          else
            echo '❌ Admin stats test failed'
            echo "$STATS_RESPONSE"
            exit 1
          fi

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: production

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Rollback deployment
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} "
            cd /opt/hras
            ./zarf/scripts/deploy-hetzner.sh rollback
          "
