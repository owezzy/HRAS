# HRAS Production Deployment Pipeline - Docker Compose
# Deploys to EC2 using Docker Compose when PRs are merged into main branch

name: Deploy to Production (Docker)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22.x'
  PYTHON_VERSION: '3.12'

# Ensure only one deployment runs at a time
concurrency:
  group: deploy-production-docker
  cancel-in-progress: false

jobs:
  # =============================================================================
  # Quality Gates
  # =============================================================================

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Frontend Quality
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.hras.owezzy.tech

      # Backend Quality
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync --all-groups

      - name: Lint backend
        run: |
          cd backend
          uv run ruff check src

      - name: Run backend tests
        run: |
          cd backend
          uv run pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          fail_ci_if_error: false

  # =============================================================================
  # Deploy to EC2 with Docker Compose
  # =============================================================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: quality-gates
    if: success() || github.event.inputs.force_deploy == 'true'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            sudo mkdir -p /opt/hras
            sudo chown ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} /opt/hras
          "

      - name: Sync repository to EC2
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='coverage.xml' \
            --delete \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/hras/

      - name: Deploy with Docker Compose
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd /opt/hras

            # Create production environment file
            cat > .env.prod << 'EOF'
          DATABASE_URL=postgresql+asyncpg://hras:${{ secrets.DB_PASSWORD }}@postgres:5432/hras
          OLLAMA_BASE_URL=http://ollama:11434
          OLLAMA_MODEL=nemotron-3-nano:30b-cloud
          OLLAMA_EMBEDDING_MODEL=nomic-embed-text
          CHROMA_PERSIST_DIRECTORY=/app/chroma_db
          POSTGRES_USER=hras
          POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
          POSTGRES_DB=hras
          DOMAIN=${{ secrets.DOMAIN }}
          LETSENCRYPT_EMAIL=${{ secrets.LETSENCRYPT_EMAIL }}
          EOF

            # Stop existing services gracefully
            echo 'Stopping existing services...'
            docker compose -f zarf/docker/compose/docker-compose.yml --profile full down --timeout 30 || true

            # Pull latest images and rebuild if needed
            echo 'Building and updating images...'
            docker compose -f zarf/docker/compose/docker-compose.yml --profile full pull || true
            docker compose -f zarf/docker/compose/docker-compose.yml --profile full build --no-cache backend

            # Start services with dependency order
            echo 'Starting services...'
            docker compose -f zarf/docker/compose/docker-compose.yml --profile full up -d

            # Wait for critical services to be healthy with extended timeout
            echo 'Waiting for services to be ready...'

            # Wait for backend to be healthy (up to 3 minutes)
            echo 'Waiting for backend...'
            for i in {1..36}; do
              if docker inspect --format='{{.State.Health.Status}}' hras-backend 2>/dev/null | grep -q 'healthy'; then
                echo '✅ Backend is healthy'
                break
              fi
              if [ \$i -eq 36 ]; then
                echo '❌ Backend health check timeout'
                docker logs hras-backend --tail 50
                exit 1
              fi
              echo \"Waiting for backend... (\$i/36)\"
              sleep 5
            done

            # Show final container status
            echo '=== Container Status ==='
            docker compose -f zarf/docker/compose/docker-compose.yml --profile full ps
          "

      - name: Verify deployment health
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30

          # Check service health
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd /opt/hras
            echo '=== Docker Compose Status ==='
            docker compose -f zarf/docker/compose/docker-compose.yml --profile full ps

            echo '=== Container Health ==='
            docker compose -f zarf/docker/compose/docker-compose.yml --profile full ps --format table
          "

          # Health check via HTTP
          for i in {1..10}; do
            if curl -f -s https://${{ secrets.DOMAIN }}/health; then
              echo "✅ Backend health check passed"
              break
            elif [ $i -eq 10 ]; then
              echo "❌ Backend health check failed after 10 attempts"
              exit 1
            else
              echo "⏳ Waiting for backend... (attempt $i/10)"
              sleep 10
            fi
          done

      - name: Run post-deployment tests
        run: |
          # Test chat endpoint
          echo "Testing chat endpoint..."
          CHAT_RESPONSE=$(curl -s -X POST https://${{ secrets.DOMAIN }}/api/v1/chat \
            -H "Content-Type: application/json" \
            -d '{"message": "Hello, test deployment"}')

          if echo "$CHAT_RESPONSE" | jq -e '.message.content' > /dev/null; then
            echo "✅ Chat endpoint test passed"
            echo "$CHAT_RESPONSE" | jq .
          else
            echo "❌ Chat endpoint test failed"
            echo "$CHAT_RESPONSE"
            exit 1
          fi

          # Test vector store stats
          echo "Testing admin stats..."
          STATS_RESPONSE=$(curl -s https://${{ secrets.DOMAIN }}/api/v1/admin/stats)
          if echo "$STATS_RESPONSE" | jq -e '.count' > /dev/null; then
            echo "✅ Admin stats test passed"
            echo "$STATS_RESPONSE" | jq .
          else
            echo "❌ Admin stats test failed"
            echo "$STATS_RESPONSE"
          fi

          echo "🎉 Deployment completed successfully!"

  # =============================================================================
  # Rollback on Failure
  # =============================================================================

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: production

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Rollback to previous deployment
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd /opt/hras

            echo 'Rolling back deployment...'

            # Stop current services
            docker compose -f zarf/docker/compose/docker-compose.yml --profile full down --timeout 30

            # Restore from backup if exists
            if [ -f docker-compose.backup.yml ]; then
              echo 'Restoring previous docker-compose configuration...'
              cp docker-compose.backup.yml zarf/docker/compose/docker-compose.yml
            fi

            # Start previous version
            docker compose -f zarf/docker/compose/docker-compose.yml --profile full up -d

            echo 'Rollback completed - check service status:'
            docker compose -f zarf/docker/compose/docker-compose.yml --profile full ps
          "

          echo "🔄 Rollback completed"

  # =============================================================================
  # Notifications
  # =============================================================================

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [quality-gates, deploy]
    if: always()

    steps:
      - name: Notify on success
        if: needs.deploy.result == 'success'
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
              -H 'Content-type: application/json' \
              --data '{
                "text": "🚀 HRAS Production Deployment Successful (Docker)",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*HRAS Production Deployment* ✅\n\n• *Commit:* `${{ github.sha }}`\n• *Author:* ${{ github.actor }}\n• *Method:* Docker Compose\n• *URL:* https://${{ secrets.DOMAIN }}\n• *API:* https://${{ secrets.DOMAIN }}/api/docs"
                    }
                  }
                ]
              }'
          else
            echo "✅ Deployment successful but no Slack webhook configured"
          fi

      - name: Notify on failure
        if: needs.deploy.result == 'failure' || needs.quality-gates.result == 'failure'
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
              -H 'Content-type: application/json' \
              --data '{
                "text": "❌ HRAS Production Deployment Failed (Docker)",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*HRAS Production Deployment* ❌\n\n• *Commit:* `${{ github.sha }}`\n• *Author:* ${{ github.actor }}\n• *Method:* Docker Compose\n• *View Logs:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  }
                ]
              }'
          else
            echo "❌ Deployment failed but no Slack webhook configured"
          fi
