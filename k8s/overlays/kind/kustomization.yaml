apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Include base HRAS resources
resources:
  - ../../base
  # Nginx Ingress Controller for Kind
  - https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml

# Patches for Kind-specific configuration
patches:
  # Update backend configmap for host.docker.internal
  - patch: |-
      - op: replace
        path: /data/OLLAMA_BASE_URL
        value: "http://host.docker.internal:11434"
    target:
      kind: ConfigMap
      name: hras-backend-config
