apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/backend/
  - ./dev-backend-configmap.yaml
patches:
  - path: ./dev-backend-patch-deploy.yaml
  - path: ./dev-backend-patch-service.yaml
images:
  - name: backend-image
    newName: localhost/hras-backend
    newTag: "0.0.1"
