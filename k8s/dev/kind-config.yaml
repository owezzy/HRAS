kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 3000
        hostPort: 3000
      - containerPort: 8000
        hostPort: 8000
      - containerPort: 30090
        hostPort: 9090
      - containerPort: 30030
        hostPort: 3001
      - containerPort: 30093
        hostPort: 9093
