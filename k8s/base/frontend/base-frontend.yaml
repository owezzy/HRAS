apiVersion: v1
kind: Namespace
metadata:
  name: hras-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hras-system

spec:
  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      terminationGracePeriodSeconds: 60

      containers:
        - name: frontend
          image: frontend-image

          ports:
            - name: http
              containerPort: 3000

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 2

          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: api_url
                  optional: true

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: hras-system

spec:
  selector:
    app: frontend
