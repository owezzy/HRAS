apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: hras-system
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: serviceaccount

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-role
  namespace: hras-system
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: rbac
rules: []

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-rolebinding
  namespace: hras-system
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: rbac
subjects:
  - kind: ServiceAccount
    name: frontend-sa
    namespace: hras-system
roleRef:
  kind: Role
  name: frontend-role
  apiGroup: rbac.authorization.k8s.io
