apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: server
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        monitor: 'hras-monitor'

    # Alertmanager configuration
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    # Load alert rules
    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # HRAS Backend metrics - primary scrape target
      - job_name: 'hras-backend'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - hras-system
        relabel_configs:
          # Keep pods with prometheus.io/scrape annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # Use custom path if specified
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Use custom port if specified
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # Add pod labels
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          # Add namespace label
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          # Add pod name label
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # Kubernetes API server metrics
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Kubernetes nodes (kubelet metrics)
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      # Kubernetes services with prometheus.io annotations
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: service
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: kubernetes_name

  # Alert rules for HRAS AI/ML pipeline
  alerts.yaml: |
    groups:
      - name: hras-backend
        interval: 30s
        rules:
          # High error rate alert
          - alert: HighErrorRate
            expr: |
              sum(rate(hras_errors_total[5m])) > 0.1
            for: 5m
            labels:
              severity: warning
              component: backend
            annotations:
              summary: "High error rate detected in HRAS backend"
              description: "Error rate is {{ $value | printf \"%.2f\" }} errors/sec over the last 5 minutes"

          # Slow RAG queries (p95 > 30s)
          - alert: SlowRAGQueries
            expr: |
              histogram_quantile(0.95, sum(rate(hras_rag_query_duration_seconds_bucket[5m])) by (le)) > 30
            for: 5m
            labels:
              severity: warning
              component: rag
            annotations:
              summary: "RAG queries are slow"
              description: "95th percentile RAG query latency is {{ $value | printf \"%.2f\" }}s (threshold: 30s)"

          # High model latency (p95 > 60s)
          - alert: HighModelLatency
            expr: |
              histogram_quantile(0.95, sum(rate(hras_model_inference_duration_seconds_bucket[5m])) by (le)) > 60
            for: 5m
            labels:
              severity: warning
              component: model
            annotations:
              summary: "Model inference latency is high"
              description: "95th percentile model inference latency is {{ $value | printf \"%.2f\" }}s (threshold: 60s)"

          # Low vector store documents
          - alert: LowVectorStoreDocuments
            expr: |
              hras_vectorstore_documents < 10
            for: 5m
            labels:
              severity: critical
              component: vectorstore
            annotations:
              summary: "Vector store has very few documents"
              description: "Vector store contains only {{ $value }} documents (threshold: 10)"

          # High HTTP error rate (5xx)
          - alert: HighHTTPErrorRate
            expr: |
              sum(rate(hras_http_requests_total{status_code=~"5.."}[5m])) / sum(rate(hras_http_requests_total[5m])) > 0.05
            for: 5m
            labels:
              severity: critical
              component: http
            annotations:
              summary: "High HTTP 5xx error rate"
              description: "HTTP 5xx error rate is {{ $value | printf \"%.2f\" }}%"

          # Agent execution failures
          - alert: AgentExecutionFailures
            expr: |
              sum(rate(hras_agent_executions_total{status="error"}[5m])) > 0.1
            for: 5m
            labels:
              severity: warning
              component: agent
            annotations:
              summary: "Agent execution failures detected"
              description: "Agent failure rate is {{ $value | printf \"%.2f\" }} failures/sec"

          # High request latency (p95 > 5s)
          - alert: HighRequestLatency
            expr: |
              histogram_quantile(0.95, sum(rate(hras_http_request_duration_seconds_bucket[5m])) by (le)) > 5
            for: 5m
            labels:
              severity: warning
              component: http
            annotations:
              summary: "HTTP request latency is high"
              description: "95th percentile request latency is {{ $value | printf \"%.2f\" }}s"

          # No active chat sessions (potential issue)
          - alert: NoActiveChatSessions
            expr: |
              hras_chat_sessions_active == 0
            for: 30m
            labels:
              severity: info
              component: chat
            annotations:
              summary: "No active chat sessions"
              description: "No chat sessions have been active for 30 minutes"

      - name: hras-infrastructure
        interval: 30s
        rules:
          # Pod restart alert
          - alert: PodCrashLooping
            expr: |
              rate(kube_pod_container_status_restarts_total{namespace="hras-system"}[15m]) > 0
            for: 5m
            labels:
              severity: critical
              component: infrastructure
            annotations:
              summary: "Pod is crash looping"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is restarting frequently"

          # High memory usage
          - alert: HighMemoryUsage
            expr: |
              container_memory_working_set_bytes{namespace="hras-system"} / container_spec_memory_limit_bytes{namespace="hras-system"} > 0.9
            for: 5m
            labels:
              severity: warning
              component: infrastructure
            annotations:
              summary: "High memory usage detected"
              description: "Container {{ $labels.container }} is using {{ $value | printf \"%.0f\" }}% of its memory limit"

          # High CPU usage
          - alert: HighCPUUsage
            expr: |
              rate(container_cpu_usage_seconds_total{namespace="hras-system"}[5m]) / container_spec_cpu_quota{namespace="hras-system"} * 100000 > 0.9
            for: 5m
            labels:
              severity: warning
              component: infrastructure
            annotations:
              summary: "High CPU usage detected"
              description: "Container {{ $labels.container }} is using {{ $value | printf \"%.0f\" }}% of its CPU limit"
