apiVersion: apps/v1
kind: Deployment
metadata:
  name: hras-frontend
  namespace: hras
  labels:
    app.kubernetes.io/name: hras-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hras-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hras-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: localhost/hras-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://hras-backend.hras.svc.cluster.local:8000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
