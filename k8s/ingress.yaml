apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hras-ingress
  namespace: hras
  labels:
    app.kubernetes.io/name: hras
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hras.example.com
      secretName: hras-tls
  rules:
    - host: hras.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hras-backend
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: hras-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hras-frontend
                port:
                  number: 3000
