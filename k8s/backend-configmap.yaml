apiVersion: v1
kind: ConfigMap
metadata:
  name: hras-backend-config
  namespace: hras
  labels:
    app.kubernetes.io/name: hras-backend
    app.kubernetes.io/component: backend
data:
  OLLAMA_BASE_URL: "http://ollama.ollama.svc.cluster.local:11434"
  OLLAMA_MODEL: "nemotron-3-nano:30b-cloud"
  OLLAMA_EMBEDDING_MODEL: "nomic-embed-text"
  CHROMA_PERSIST_DIRECTORY: "/data/chroma_db"
  DATABASE_URL: "sqlite+aiosqlite:///data/hras.db"
  CORS_ORIGINS: '["http://localhost:3000","https://hras.example.com"]'
  DEBUG: "false"
