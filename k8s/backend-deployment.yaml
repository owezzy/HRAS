apiVersion: apps/v1
kind: Deployment
metadata:
  name: hras-backend
  namespace: hras
  labels:
    app.kubernetes.io/name: hras-backend
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hras-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hras-backend
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: localhost/hras-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hras-backend-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hras-backend-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hras-backend-pvc
  namespace: hras
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
