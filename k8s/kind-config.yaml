# Kind cluster configuration with ingress support
# Usage: kind create cluster --config=k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP - maps localhost:80 to ingress controller
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS - maps localhost:443 to ingress controller
      - containerPort: 443
        hostPort: 443
        protocol: TCP
