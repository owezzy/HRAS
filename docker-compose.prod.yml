version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: hras-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - certbot-data:/etc/letsencrypt:ro
      - certbot-challenges:/var/www/certbot:ro
      - ./nginx/dhparam.pem:/etc/letsencrypt/dhparam.pem:ro
      - nginx-logs:/var/log/nginx
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/includes:/etc/nginx/includes:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hras-network
    environment:
      - TZ=UTC
      - DOMAIN=${DOMAIN}
      - FRONTEND_DOMAIN=${FRONTEND_DOMAIN}
      - NGINX_ENVSUBST_TEMPLATE_SUFFIX=.template
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.docker.compose.service=hras-nginx"
      - "com.hras.component=reverse-proxy"

  certbot:
    image: certbot/dns-route53:v2.7.4
    container_name: hras-certbot
    restart: "no"
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-challenges:/var/www/certbot
      - certbot-logs:/var/log/letsencrypt
      - ./scripts/ssl:/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
      - DOMAIN=${DOMAIN}
      - NOTIFICATION_WEBHOOK=${NOTIFICATION_WEBHOOK}
    command: >
      sh -c "
        echo 'Starting certificate management daemon...';

        mkdir -p /etc/letsencrypt/renewal-hooks/deploy;
        cat > /etc/letsencrypt/renewal-hooks/deploy/nginx-reload.sh << 'EOF'
        #!/bin/sh
        echo 'Certificate renewed, reloading nginx...'
        docker exec hras-nginx nginx -s reload || echo 'Failed to reload nginx'
        if [ -n \"$$NOTIFICATION_WEBHOOK\" ]; then
          curl -X POST \"$$NOTIFICATION_WEBHOOK\" -H 'Content-Type: application/json' -d '{\"text\":\"SSL certificate renewed for $$DOMAIN\"}'
        fi
        EOF
        chmod +x /etc/letsencrypt/renewal-hooks/deploy/nginx-reload.sh;

        if [ ! -f /etc/letsencrypt/live/$$DOMAIN/fullchain.pem ]; then
          echo 'No existing certificates found, attempting to obtain...';
          certbot certonly --dns-route53 --non-interactive --agree-tos --email $$CERTBOT_EMAIL --no-eff-email -d $$DOMAIN -d www.$$DOMAIN;
        fi;

        trap exit TERM;
        while :; do
          echo 'Checking for certificate renewal...';
          certbot renew --dns-route53 --non-interactive --agree-tos --no-eff-email --keep-until-expiring --preferred-challenges dns --deploy-hook '/etc/letsencrypt/renewal-hooks/deploy/nginx-reload.sh';
          echo 'Sleeping for 12h...';
          sleep 43200 & wait $$!;
        done
      "
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - hras-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
    security_opt:
      - no-new-privileges:true

  certbot-init:
    image: certbot/dns-route53:v2.7.4
    container_name: hras-certbot-init
    restart: "no"
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-challenges:/var/www/certbot
      - certbot-logs:/var/log/letsencrypt
      - ./scripts/ssl:/scripts:ro
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
      - DOMAIN=${DOMAIN}
    command: >
      sh -c "
        echo 'Obtaining initial SSL certificates for $$DOMAIN...';

        if [ ! -f /etc/letsencrypt/dhparam.pem ]; then
          echo 'Generating DH parameters...';
          openssl dhparam -out /etc/letsencrypt/dhparam.pem 2048;
        fi;

        certbot certonly --dns-route53 --non-interactive --agree-tos --email $$CERTBOT_EMAIL --no-eff-email -d $$DOMAIN -d www.$$DOMAIN --key-type rsa --rsa-key-size 4096;

        chmod 644 /etc/letsencrypt/live/$$DOMAIN/*.pem;
        chmod 600 /etc/letsencrypt/live/$$DOMAIN/privkey.pem;

        echo 'Initial certificate acquisition completed.';
      "
    networks:
      - hras-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
    security_opt:
      - no-new-privileges:true
    profiles:
      - init

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        - BUILDKIT_INLINE_CACHE=1
        - BUILD_DATE=${BUILD_DATE}
        - VCS_REF=${VCS_REF}
        - VERSION=${VERSION}
    image: hras-backend:${VERSION:-latest}
    container_name: hras-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/hras.db}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-nemotron-3-nano:30b-cloud}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma_db
      - CORS_ORIGINS=${CORS_ORIGINS:-["https://${FRONTEND_DOMAIN}","https://www.${FRONTEND_DOMAIN}","https://${DOMAIN}","https://www.${DOMAIN}"]}
      - DEBUG=false
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - USE_POSTGRES=${USE_POSTGRES:-false}
      - USE_ASYNC_TOOLS=${USE_ASYNC_TOOLS:-true}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - HEALTH_CHECK_TOKEN=${HEALTH_CHECK_TOKEN}
      - HEALTH_CHECK_ENDPOINT=/health
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - SENTRY_DSN=${SENTRY_DSN}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - STRUCTURED_LOGGING=true
      - UVICORN_WORKERS=${UVICORN_WORKERS:-4}
      - UVICORN_WORKER_CLASS=uvicorn.workers.UvicornWorker
      - BACKEND_TIMEOUT=${BACKEND_TIMEOUT:-120}
      - DATABASE_TIMEOUT=${DATABASE_TIMEOUT:-30}
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
      - ./backend/config:/app/config:ro
    networks:
      - hras-network
      - backend-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health?token=${HEALTH_CHECK_TOKEN}', timeout=10).raise_for_status()"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
          cpus: '1'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,size=200m
    user: "1000:1000"
    init: true
    labels:
      - "com.docker.compose.service=hras-backend"
      - "com.hras.component=api-server"
      - "com.hras.version=${VERSION}"

  postgres:
    image: postgres:17-alpine
    container_name: hras-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-hras}
      - POSTGRES_USER=${POSTGRES_USER:-hras}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS="--auth-host=scram-sha-256 --data-checksums"
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
      - PGDATA=/var/lib/postgresql/data/pgdata
      - TZ=UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-logs:/var/log/postgresql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hras} -d ${POSTGRES_DB:-hras} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    user: "70:70"
    profiles:
      - postgres
    labels:
      - "com.docker.compose.service=hras-postgres"
      - "com.hras.component=database"

  redis:
    image: redis:7-alpine
    container_name: hras-redis
    restart: unless-stopped
    command: >
      redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb --maxmemory-policy allkeys-lru
      --tcp-keepalive 60 --tcp-backlog 511
      --save 900 1 --save 300 10 --save 60 10000
      --protected-mode yes --port 6379
      --bind 0.0.0.0 --timeout 300
    volumes:
      - redis-data:/data
      - redis-logs:/var/log/redis
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    user: "999:999"
    profiles:
      - redis
    labels:
      - "com.docker.compose.service=hras-redis"
      - "com.hras.component=cache"

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: hras-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./zarf/docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./zarf/docker/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.wal-compression'
    networks:
      - hras-network
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    profiles:
      - monitoring
    labels:
      - "com.docker.compose.service=hras-prometheus"
      - "com.hras.component=monitoring"

  loki:
    image: grafana/loki:2.9.4
    container_name: hras-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./zarf/docker/monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    profiles:
      - monitoring
    labels:
      - "com.docker.compose.service=hras-loki"
      - "com.hras.component=logging"

  grafana:
    image: grafana/grafana:10.2.3
    container_name: hras-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
      - GF_DATABASE_TYPE=sqlite3
      - GF_DATABASE_PATH=/var/lib/grafana/grafana.db
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./zarf/docker/monitoring/grafana:/etc/grafana/provisioning:ro
      - ./zarf/docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    user: "472:472"
    profiles:
      - monitoring
    labels:
      - "com.docker.compose.service=hras-grafana"
      - "com.hras.component=visualization"

  promtail:
    image: grafana/promtail:2.9.4
    container_name: hras-promtail
    restart: unless-stopped
    volumes:
      - ./zarf/docker/monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - nginx-logs:/var/log/nginx:ro
      - backend-logs:/var/log/backend:ro
      - postgres-logs:/var/log/postgres:ro
      - redis-logs:/var/log/redis:ro
      - certbot-logs:/var/log/certbot:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring-network
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    security_opt:
      - no-new-privileges:true
    user: "0:0"
    profiles:
      - monitoring
    labels:
      - "com.docker.compose.service=hras-promtail"
      - "com.hras.component=log-shipper"

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: hras-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./zarf/docker/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
      - '--cluster.advertise-address=0.0.0.0:9093'
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    profiles:
      - monitoring
    labels:
      - "com.docker.compose.service=hras-alertmanager"
      - "com.hras.component=alerting"

volumes:
  certbot-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SSL_CERT_PATH:-./data/certbot}/data
  certbot-challenges:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SSL_CERT_PATH:-./data/certbot}/challenges
  certbot-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOGS_PATH:-./data/logs}/certbot

  backend-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/backend
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/postgres
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/redis

  nginx-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOGS_PATH:-./data/logs}/nginx
  backend-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOGS_PATH:-./data/logs}/backend
  postgres-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOGS_PATH:-./data/logs}/postgres
  redis-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOGS_PATH:-./data/logs}/redis

  prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/prometheus
  loki-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/loki
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/grafana
  alertmanager-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/alertmanager

networks:
  hras-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

  backend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24

  monitoring-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
