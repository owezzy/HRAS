apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: hras-production
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    environment: production
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
type: Opaque
stringData:
  username: hras_prod
  password: "SEALED_SECRET_PLACEHOLDER"
  database_url: "postgresql+asyncpg://hras_prod:SEALED_SECRET_PLACEHOLDER@postgres.hras-production.svc.cluster.local:5432/hras"
