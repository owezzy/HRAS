apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: hras-production
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    environment: production
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 8000
      targetPort: 8000
      protocol: TCP
