apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/backend/
  - ./configmap.yaml
  - ./langsmith-secret.yaml

patches:
  - path: ./deployment-patch.yaml
  - path: ./service-patch.yaml
  - path: ./ingest-job-patch.yaml

images:
  - name: backend-image
    newName: localhost/hras-backend
    newTag: "latest"
  - name: ingest-image
    newName: localhost/hras-backend
    newTag: "latest"
