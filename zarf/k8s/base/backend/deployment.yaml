apiVersion: v1
kind: Namespace
metadata:
  name: hras-system
  labels:
    app.kubernetes.io/name: hras
    app.kubernetes.io/component: backend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hras-system
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"

    spec:
      serviceAccountName: backend-sa
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: backend-image
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          ports:
            - name: api
              containerPort: 8000
            - name: metrics
              containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 2

          env:
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ollama_base_url
                  optional: true
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ollama_model
                  optional: true
            - name: OLLAMA_EMBEDDING_MODEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ollama_embedding_model
                  optional: true
            - name: CHROMA_PERSIST_DIRECTORY
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: chroma_persist_directory
                  optional: true
            - name: USE_LANGSMITH_TRACING
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: use_langsmith_tracing
                  optional: true
            - name: LANGSMITH_PROJECT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: langsmith_project
                  optional: true
            - name: LANGSMITH_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: langsmith_endpoint
                  optional: true
            - name: LANGSMITH_SAMPLING_RATE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: langsmith_sampling_rate
                  optional: true
            - name: LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: langsmith-credentials
                  key: api_key
                  optional: true

          volumeMounts:
            - name: data
              mountPath: /data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: hras-system
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
