[security]
# Disable authentication for development
disable_login_form = false
allow_embedding = true

[auth]
disable_login_form = false

[auth.anonymous]
# Enable anonymous access (open Grafana)
enabled = true
org_name = Main Org.
org_role = Admin
hide_version = true

[users]
# Allow anonymous users to edit dashboards
viewers_can_edit = true
editors_can_admin = true

[dashboards]
# Set default dashboard
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/hras-overview.json

[server]
# Server settings
http_port = 3000
domain = localhost
root_url = http://localhost:3001/
serve_from_sub_path = false

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = info
