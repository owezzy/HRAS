services:
  postgres:
    image: postgres:17-alpine
    container_name: hras-postgres
    environment:
      POSTGRES_USER: hras
      POSTGRES_PASSWORD: hras_dev_password
      POSTGRES_DB: hras
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hras -d hras"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hras-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://hras:hras_dev_password@postgres:5432/hras
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CHROMA_PERSIST_DIRECTORY: /app/chroma_db
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hras-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    profiles:
      - full

volumes:
  postgres_data:
  chroma_data:
