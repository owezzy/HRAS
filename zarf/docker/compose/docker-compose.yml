services:
  postgres:
    image: postgres:17-alpine
    container_name: hras-postgres
    environment:
      POSTGRES_USER: hras
      POSTGRES_PASSWORD: hras_dev_password
      POSTGRES_DB: hras
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hras -d hras"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../..
      dockerfile: zarf/docker/dockerfile.backend
    container_name: hras-backend
    user: "1000:1000"
    environment:
      DATABASE_URL: postgresql+asyncpg://hras:hras_dev_password@postgres:5432/hras
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      CHROMA_PERSIST_DIRECTORY: /app/chroma_db
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    profiles:
      - full
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Auto-ingestion init service - runs once after backend is healthy
  ingest-init:
    image: curlimages/curl:latest
    container_name: hras-ingest-init
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "=== HRAS Data Ingestion Init ==="

        MAX_RETRIES=5
        RETRY_DELAY=3

        for i in $$(seq 1 $$MAX_RETRIES); do
          echo "Attempt $$i/$$MAX_RETRIES: Checking vector store stats..."

          STATS=$$(curl -s http://backend:8000/api/v1/admin/stats)

          if echo "$$STATS" | grep -q '"count"'; then
            COUNT=$$(echo "$$STATS" | grep -o '"count":[0-9]*' | grep -o '[0-9]*')
            echo "Current document count: $$COUNT"

            if [ "$$COUNT" -ge 10 ]; then
              echo "Vector store already has $$COUNT documents. Skipping ingestion."
              exit 0
            fi

            echo "Vector store has $$COUNT documents. Starting ingestion..."
            RESULT=$$(curl -s -X POST http://backend:8000/api/v1/admin/ingest \
              -H "Content-Type: application/json" \
              -d '{"clear_existing": false, "use_sample": true}')

            if echo "$$RESULT" | grep -q '"documents_added"'; then
              echo "Ingestion successful: $$RESULT"
              sleep 2
              FINAL_STATS=$$(curl -s http://backend:8000/api/v1/admin/stats)
              echo "Final stats: $$FINAL_STATS"
              exit 0
            else
              echo "Ingestion failed: $$RESULT"
            fi
          else
            echo "Stats check failed: $$STATS"
          fi

          echo "Retrying in $$RETRY_DELAY seconds..."
          sleep $$RETRY_DELAY
        done

        echo "=== Ingestion failed after $$MAX_RETRIES attempts ==="
        exit 1
    profiles:
      - full

  # Monitoring Services
  prometheus:
    image: prom/prometheus:latest
    container_name: hras-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../../../zarf/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../../zarf/monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=7d'
    depends_on:
      - backend
    profiles:
      - monitoring
      - full

  grafana:
    image: grafana/grafana:latest
    container_name: hras-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../../../zarf/monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../../../zarf/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../../zarf/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - monitoring
      - full

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: hras-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://hras:hras_dev_password@postgres:5432/hras?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - monitoring
      - full

  ollama:
    image: alpine/ollama:latest
    container_name: hras-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ~/.ollama/id_ed25519:/root/.ollama/id_ed25519:ro
      - ~/.ollama/id_ed25519.pub:/root/.ollama/id_ed25519.pub:ro
    profiles:
      - full
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  chroma_data:
  prometheus_data:
  grafana_data:
  ollama_data:
