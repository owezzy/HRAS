services:
  postgres:
    image: postgres:17-alpine
    container_name: hras-postgres-dev
    environment:
      POSTGRES_USER: hras
      POSTGRES_PASSWORD: hras_dev_password
      POSTGRES_DB: hras
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hras -d hras"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../..
      dockerfile: zarf/docker/dockerfile.backend
    container_name: hras-backend-dev
    environment:
      DATABASE_URL: postgresql+asyncpg://hras:hras_dev_password@postgres:5432/hras
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CHROMA_PERSIST_DIRECTORY: /app/chroma_db
      USE_POSTGRES: "true"
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ../../../backend:/app
      - chroma_data:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ../../../backend/src
          target: /app/src
        - action: rebuild
          path: ../../../backend/pyproject.toml

  # Development Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: hras-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ../../../zarf/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=1d'
    depends_on:
      - backend
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: hras-grafana-dev
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ../../../zarf/monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../../../zarf/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../../zarf/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - monitoring

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: hras-postgres-exporter-dev
    environment:
      DATA_SOURCE_NAME: "postgresql://hras:hras_dev_password@postgres:5432/hras?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - monitoring

volumes:
  postgres_data:
  chroma_data:
  prometheus_data:
  grafana_data:
