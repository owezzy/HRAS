user nginx;
worker_processes auto;
worker_cpu_affinity auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json_combined escape=json
        '{'
            '"time_local":"$time_local",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"request":"$request",'
            '"status": "$status",'
            '"body_bytes_sent":"$body_bytes_sent",'
            '"request_time":"$request_time",'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"upstream_connect_time":"$upstream_connect_time",'
            '"upstream_header_time":"$upstream_header_time",'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    client_max_body_size 64M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_requests 1000;
    send_timeout 10;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    open_file_cache max=200000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream backend {
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ==========================================================================
    # Rate Limiting Zones (DDoS Protection)
    # ==========================================================================

    # General API rate limiting: 10 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api:20m rate=10r/s;

    # Health check endpoints: Higher rate for monitoring
    limit_req_zone $binary_remote_addr zone=health:10m rate=30r/s;

    # Strict rate limiting for sensitive endpoints (admin, auth)
    limit_req_zone $binary_remote_addr zone=sensitive:10m rate=2r/s;

    # Chat endpoint: Lower rate for expensive AI operations
    limit_req_zone $binary_remote_addr zone=chat:20m rate=5r/s;

    # Connection limiting per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Request rate limiting per server (global limit)
    limit_req_zone $server_name zone=server_limit:10m rate=1000r/s;

    # Rate limiting response configuration
    limit_req_status 429;
    limit_conn_status 429;

    # Log rate-limited requests for security monitoring
    limit_req_log_level warn;
    limit_conn_log_level warn;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    error_log /var/log/nginx/stream_error.log;
}
