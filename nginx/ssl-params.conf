# =============================================================================
# HRAS Production SSL/TLS Security Configuration
# Last Updated: 2026-01-16
# Compliance: OWASP ASVS V14.4, NIST SP 800-52r2
# =============================================================================

# TLS Protocol Configuration
# - TLS 1.3 preferred for best security and performance
# - TLS 1.2 maintained for compatibility
ssl_protocols TLSv1.2 TLSv1.3;

# Cipher Suite Configuration
# TLS 1.3 ciphers are automatically used when available
# TLS 1.2 ciphers follow Mozilla Modern compatibility
ssl_prefer_server_ciphers off;  # Let client choose best cipher (modern approach)
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_ecdh_curve X25519:secp384r1:secp256r1;

# Session Configuration
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:50m;
ssl_session_tickets off;

# OCSP Stapling for faster certificate validation
ssl_stapling on;
ssl_stapling_verify on;

# DNS resolver for OCSP stapling (Cloudflare DNS with fallback)
resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 valid=300s ipv6=off;
resolver_timeout 5s;

# Diffie-Hellman parameter for DHE ciphersuites
ssl_dhparam /etc/letsencrypt/dhparam.pem;

# =============================================================================
# Security Headers (OWASP Recommended)
# =============================================================================

# HTTP Strict Transport Security (HSTS)
# - 2 years max-age, include subdomains, enable preload
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Prevent clickjacking attacks
add_header X-Frame-Options "DENY" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Referrer Policy - strict for privacy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy - Restrictive for API backend
# Note: Adjust if frontend is served from same domain
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests;" always;

# Permissions Policy - Disable unnecessary browser features
add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), cross-origin-isolated=(), display-capture=(), document-domain=(), encrypted-media=(), execution-while-not-rendered=(), execution-while-out-of-viewport=(), fullscreen=(), geolocation=(), gyroscope=(), keyboard-map=(), magnetometer=(), microphone=(), midi=(), navigation-override=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()" always;

# Cross-Origin headers for API security
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Remove X-XSS-Protection (deprecated, CSP is preferred)
# Note: Some scanners may still flag this, but CSP provides better protection

# Cache Control for sensitive API responses
add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
add_header Pragma "no-cache" always;
